<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJ Blues 12 Key Practice</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  font-family:Arial,"Noto Sans KR",sans-serif
}

.app{
  width:min(760px,94vw);
  margin:35px auto;
  background:#fff;
  border-radius:22px;
  padding:35px;
  box-shadow:0 12px 40px rgba(0,0,0,.08);
  border:1px solid #ddd
}

h1{
  margin:0;
  font-size:27px
}

.sub{
  color:#777;
  margin-top:8px
}

.keyLabel{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-top:35px
}

.key{
  text-align:center;
  font-size:100px;
  font-weight:900;
  line-height:1;
  margin:8px 0 5px
}

.status{
  text-align:center;
  color:#777;
  min-height:22px;
  margin:8px 0 25px
}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap
}

button{
  border:0;
  border-radius:12px;
  padding:15px 23px;
  font-size:16px;
  font-weight:700;
  cursor:pointer
}

.primary{
  background:#111;
  color:#fff
}

.secondary{
  background:#e9e9e9
}

button:disabled{
  opacity:.4;
  cursor:not-allowed
}

.settings{
  margin-top:30px;
  border-top:1px solid #eee;
  padding-top:25px;
  display:flex;
  justify-content:center;
  gap:35px;
  flex-wrap:wrap;
  text-align:center
}

.setting label{
  display:block;
  color:#888;
  font-size:13px;
  margin-bottom:8px
}

input[type=range]{
  width:210px
}

.value{
  font-weight:700;
  margin-top:4px
}

select{
  padding:9px 12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px
}

.progress{
  height:7px;
  background:#eee;
  border-radius:99px;
  overflow:hidden;
  margin-top:25px
}

.bar{
  height:100%;
  width:0;
  background:#111
}

.keys{
  margin-top:30px;
  border-top:1px solid #eee;
  padding-top:25px
}

.keys h2{
  font-size:17px;
  margin:0 0 12px
}

.keygrid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:7px
}

.keybtn{
  padding:11px 5px;
  font-size:14px;
  background:#f0f0f0
}

.keybtn.active{
  background:#111;
  color:#fff
}

.note{
  font-size:12px;
  color:#999;
  margin-top:22px;
  text-align:center;
  line-height:1.5
}


/* =========================
   코드 진행 버튼
========================= */

.progressionButtonWrap{
  display:flex;
  justify-content:center;
  margin-top:18px
}

.progressionButton{
  background:#f0f0f0;
  color:#111;
  border:1px solid #ddd;
  padding:12px 20px;
  font-size:15px
}

.progressionButton:hover{
  background:#e7e7e7
}


/* =========================
   코드 진행 모달
========================= */

.progressionModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999
}

.progressionModal.hidden{
  display:none
}

.progressionBox{
  width:min(680px,94vw);
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 15px 50px rgba(0,0,0,.2)
}

.progressionHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px
}

.progressionTitle{
  font-size:20px;
  font-weight:800
}

.progressionClose{
  width:38px;
  height:38px;
  padding:0;
  border-radius:50%;
  background:#eee;
  font-size:20px;
  line-height:38px
}


/* =========================
   코드 진행표
========================= */

.progressionGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px
}

.progressionCell{
  min-height:58px;
  border:1px solid #ddd;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:8px 5px;
  font-size:15px;
  font-weight:700;
  background:#fafafa;
  white-space:nowrap
}

.progressionCell .barNumber{
  color:#999;
  font-size:10px;
  margin-right:5px;
  font-weight:400
}

.progressionKey{
  color:#777;
  font-size:13px;
  margin-top:15px;
  text-align:center
}


@media(max-width:600px){

  .key{
    font-size:78px
  }

  .keygrid{
    grid-template-columns:repeat(3,1fr)
  }

  .app{
    padding:25px
  }

  .progressionBox{
    padding:20px
  }

  .progressionGrid{
    gap:5px
  }

  .progressionCell{
    min-height:52px;
    font-size:13px;
    padding:6px 3px
  }

  .progressionCell .barNumber{
    font-size:9px;
    margin-right:3px
  }
}
</style>
</head>


<body>

<div class="app">

<h1>MJ Blues 12 Key Practice</h1>

<div class="sub">
12 Key Blues · 내장 반주 연습 프로그램
</div>


<div class="keyLabel">
CURRENT KEY
</div>

<div class="key" id="key">
C
</div>

<div class="status" id="status">
준비되었습니다.
</div>


<div class="controls">

<button class="secondary" id="random">
🎲 랜덤 KEY + 자동 재생
</button>

<button class="primary" id="play">
▶ 재생
</button>

<button class="secondary" id="stop" disabled>
■ 정지
</button>

</div>


<!-- 코드 진행 보기 버튼 -->

<div class="progressionButtonWrap">

<button
  class="progressionButton"
  id="progressionBtn"
>
🎼 코드 진행 보기
</button>

</div>


<div class="settings">

<div class="setting">

<label>TEMPO</label>

<input
  id="tempo"
  type="range"
  min="70"
  max="170"
  value="120"
>

<div class="value">
<span id="tempoValue">120</span> BPM
</div>

</div>


<div class="setting">

<label>반복</label>

<select id="loops">

<option value="1">1회</option>
<option value="2">2회</option>
<option value="4">4회</option>
<option value="8">8회</option>

</select>

</div>

</div>


<div class="progress">

<div class="bar" id="bar"></div>

</div>


<div class="keys">

<h2>직접 KEY 선택</h2>

<div class="keygrid" id="keygrid"></div>

</div>


<div class="note">

12개 KEY의 블루스 반주가 내장되어 있습니다.<br>
음원은 제공받은 6개 원본을 기준으로 나머지 KEY를 트랜스포즈했습니다.

</div>

</div>


<!-- =========================
     코드 진행 모달
========================= -->

<div
  class="progressionModal hidden"
  id="progressionModal"
>

<div class="progressionBox">

<div class="progressionHeader">

<div class="progressionTitle">
코드 진행 · <span id="progressionKey">C</span>
</div>

<button
  class="progressionClose"
  id="progressionClose"
>
×
</button>

</div>


<div
  class="progressionGrid"
  id="progressionGrid"
></div>


<div class="progressionKey">
12 Bar Blues
</div>

</div>

</div>



<script>


/* =========================================
   기존 음원 데이터
   ※ 기존 코드 그대로 유지
========================================= */

const AUDIO_DATA = {
  "C":"audio/C.mp3",
  "Db":"audio/Db.mp3",
  "D":"audio/D.mp3",
  "Eb":"audio/Eb.mp3",
  "E":"audio/E.mp3",
  "F":"audio/F.mp3",
  "Gb":"audio/Gb.mp3",
  "G":"audio/G.mp3",
  "Ab":"audio/Ab.mp3",
  "A":"audio/A.mp3",
  "Bb":"audio/Bb.mp3",
  "B":"audio/B.mp3"
};


const KEYS = [
  "C",
  "Db",
  "D",
  "Eb",
  "E",
  "F",
  "Gb",
  "G",
  "Ab",
  "A",
  "Bb",
  "B"
];


let current=0;
let audio=null;
let raf=null;
let count=0;


/* =========================================
   코드 진행
========================================= */

const PROGRESSIONS = {

  "C":[
    "C7",
    "F7",
    "C7",
    "Gm7  C7",
    "F7",
    "F7",
    "C7",
    "Am7  D7",
    "Dm7",
    "G7",
    "C7  A7",
    "Dm7  G7"
  ],

  "Db":[
    "Db7",
    "Gb7",
    "Db7",
    "Abm7  Db7",
    "Gb7",
    "Gb7",
    "Db7",
    "Bbm7  Eb7",
    "Ebm7",
    "Ab7",
    "Db7  Bb7",
    "Ebm7  Ab7"
  ],

  "D":[
    "D7",
    "G7",
    "D7",
    "Am7  D7",
    "G7",
    "G7",
    "D7",
    "Bm7  E7",
    "Em7",
    "A7",
    "D7  B7",
    "Em7  A7"
  ],

  "Eb":[
    "Eb7",
    "Ab7",
    "Eb7",
    "Bbm7  Eb7",
    "Ab7",
    "Ab7",
    "Eb7",
    "Cm7  F7",
    "Fm7",
    "Bb7",
    "Eb7  C7",
    "Fm7  Bb7"
  ],

  "E":[
    "E7",
    "A7",
    "E7",
    "Bm7  E7",
    "A7",
    "A7",
    "E7",
    "C#m7  F#7",
    "F#m7",
    "B7",
    "E7  C#7",
    "F#m7  B7"
  ],

  "F":[
    "F7",
    "Bb7",
    "F7",
    "Cm7  F7",
    "Bb7",
    "Bb7",
    "F7",
    "Am7  D7",
    "Gm7",
    "C7",
    "F7  D7",
    "Gm7  C7"
  ],

  "Gb":[
    "Gb7",
    "Cb7",
    "Gb7",
    "Dbm7  Gb7",
    "Cb7",
    "Cb7",
    "Gb7",
    "Ebm7  Ab7",
    "Abm7",
    "Db7",
    "Gb7  Eb7",
    "Abm7  Db7"
  ],

  "G":[
    "G7",
    "C7",
    "G7",
    "Dm7  G7",
    "C7",
    "C7",
    "G7",
    "Em7  A7",
    "Am7",
    "D7",
    "G7  E7",
    "Am7  D7"
  ],

  "Ab":[
    "Ab7",
    "Db7",
    "Ab7",
    "Ebm7  Ab7",
    "Db7",
    "Db7",
    "Ab7",
    "Fm7  Bb7",
    "Bbm7",
    "Eb7",
    "Ab7  F7",
    "Bbm7  Eb7"
  ],

  "A":[
    "A7",
    "D7",
    "A7",
    "Em7  A7",
    "D7",
    "D7",
    "A7",
    "F#m7  B7",
    "Bm7",
    "E7",
    "A7  F#7",
    "Bm7  E7"
  ],

  "Bb":[
    "Bb7",
    "Eb7",
    "Bb7",
    "Fm7  Bb7",
    "Eb7",
    "Eb7",
    "Bb7",
    "Gm7  C7",
    "Cm7",
    "F7",
    "Bb7  G7",
    "Cm7  F7"
  ],

  "B":[
    "B7",
    "E7",
    "B7",
    "F#m7  B7",
    "E7",
    "E7",
    "B7",
    "G#m7  C#7",
    "C#m7",
    "F#7",
    "B7  G#7",
    "C#m7  F#7"
  ]

};


/* =========================================
   기존 DOM
========================================= */

const keyEl=document.getElementById("key");
const statusEl=document.getElementById("status");

const playBtn=document.getElementById("play");
const stopBtn=document.getElementById("stop");
const randomBtn=document.getElementById("random");

const tempo=document.getElementById("tempo");
const tempoValue=document.getElementById("tempoValue");

const loops=document.getElementById("loops");
const bar=document.getElementById("bar");

const keygrid=document.getElementById("keygrid");


/* =========================================
   코드 진행 DOM
========================================= */

const progressionBtn=
  document.getElementById("progressionBtn");

const progressionModal=
  document.getElementById("progressionModal");

const progressionClose=
  document.getElementById("progressionClose");

const progressionGrid=
  document.getElementById("progressionGrid");

const progressionKey=
  document.getElementById("progressionKey");


/* =========================================
   KEY 버튼 생성
========================================= */

KEYS.forEach((k,i)=>{

  const b=document.createElement("button");

  b.className="keybtn";

  b.textContent=k;

  b.onclick=()=>selectKey(i);

  keygrid.appendChild(b);

});


/* =========================================
   코드 진행 표시
========================================= */

function renderProgression(){

  const key=KEYS[current];

  const progression=PROGRESSIONS[key];

  progressionGrid.innerHTML="";

  progressionKey.textContent=key;

  progression.forEach((chord,index)=>{

    const cell=document.createElement("div");

    cell.className="progressionCell";

    cell.innerHTML=
      `<span class="barNumber">${index+1}</span>
       ${chord}`;

    progressionGrid.appendChild(cell);

  });

}


/* =========================================
   UI 업데이트
========================================= */

function updateUI(){

  keyEl.textContent=KEYS[current];

  [...keygrid.children].forEach((b,i)=>
    b.classList.toggle("active",i===current)
  );

  renderProgression();

}


/* =========================================
   KEY 선택
========================================= */

function selectKey(i){

  stopAudio();

  current=i;

  updateUI();

  statusEl.textContent=
    KEYS[current]+" Key · 재생 준비 완료";
}


/* =========================================
   랜덤 KEY
========================================= */

function randomKey(){

  stopAudio();

  let n=
    Math.floor(Math.random()*KEYS.length);

  if(n===current)
    n=(n+1)%KEYS.length;

  current=n;

  updateUI();

  playAudio();
}


/* =========================================
   TEMPO
========================================= */

tempo.oninput=()=>{

  tempoValue.textContent=tempo.value;

  if(audio)
    audio.playbackRate=
      Number(tempo.value)/120;

};


/* =========================================
   AUDIO 정지
========================================= */

function stopAudio(){

  if(audio){

    audio.pause();

    audio.currentTime=0;

    audio=null;

  }

  if(raf)
    cancelAnimationFrame(raf);

  bar.style.width="0%";

  playBtn.disabled=false;

  stopBtn.disabled=true;

  randomBtn.disabled=false;

}


/* =========================================
   AUDIO 재생
========================================= */

function playAudio(){

  stopAudio();

  const data=
    AUDIO_DATA[KEYS[current]];

  audio=new Audio(data);

  audio.preload="auto";

  audio.preservesPitch=true;

  audio.mozPreservesPitch=true;

  audio.webkitPreservesPitch=true;

  audio.playbackRate=
    Number(tempo.value)/120;

  count=0;


  audio.onloadedmetadata=()=>{

    statusEl.textContent=
      `${KEYS[current]} Key · ${tempo.value} BPM · 재생 중`;

    playBtn.disabled=true;

    stopBtn.disabled=false;

    randomBtn.disabled=true;

    audio.play();

    updateProgress();

  };


  audio.onended=()=>{

    count++;

    if(count<Number(loops.value)){

      audio.currentTime=0;

      audio.play();

    }else{

      stopAudio();

      statusEl.textContent=
        `${KEYS[current]} Key · 재생 완료`;

    }

  };


  audio.onerror=()=>{

    stopAudio();

    statusEl.textContent=
      "음원을 재생할 수 없습니다.";

  };

}


/* =========================================
   재생 진행바
========================================= */

function updateProgress(){

  if(!audio || audio.paused)
    return;

  const p=
    audio.duration ?
    audio.currentTime/audio.duration :
    0;

  bar.style.width=
    (p*100)+"%";

  raf=
    requestAnimationFrame(updateProgress);

}


/* =========================================
   코드 진행창 열기 / 닫기
========================================= */

progressionBtn.onclick=()=>{

  renderProgression();

  progressionModal.classList.remove("hidden");

};


progressionClose.onclick=()=>{

  progressionModal.classList.add("hidden");

};


/* 배경 클릭 시 닫기 */

progressionModal.onclick=(e)=>{

  if(e.target===progressionModal){

    progressionModal.classList.add("hidden");

  }

};


/* =========================================
   기존 버튼
========================================= */

playBtn.onclick=playAudio;


stopBtn.onclick=()=>{

  stopAudio();

  statusEl.textContent=
    KEYS[current]+" Key · 정지";

};


randomBtn.onclick=randomKey;


/* =========================================
   초기화
========================================= */

updateUI();

</script>

</body>
</html>
