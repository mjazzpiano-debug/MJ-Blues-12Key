<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJ Blues 12 Key Practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#111;font-family:Arial,"Noto Sans KR",sans-serif}
.app{width:min(760px,94vw);margin:35px auto;background:#fff;border-radius:22px;padding:35px;box-shadow:0 12px 40px rgba(0,0,0,.08);border:1px solid #ddd}
h1{margin:0;font-size:27px}.sub{color:#777;margin-top:8px}
.keyLabel{text-align:center;color:#888;font-size:13px;margin-top:35px}
.key{text-align:center;font-size:100px;font-weight:900;line-height:1;margin:8px 0 5px}
.status{text-align:center;color:#777;min-height:22px;margin:8px 0 25px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:15px 23px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#111;color:#fff}.secondary{background:#e9e9e9}
button:disabled{opacity:.4;cursor:not-allowed}
.settings{margin-top:30px;border-top:1px solid #eee;padding-top:25px;display:flex;justify-content:center;gap:35px;flex-wrap:wrap;text-align:center}
.setting label{display:block;color:#888;font-size:13px;margin-bottom:8px}
input[type=range]{width:210px}
.value{font-weight:700;margin-top:4px}
select{padding:9px 12px;border:1px solid #ccc;border-radius:9px;font-size:15px}
.progress{height:7px;background:#eee;border-radius:99px;overflow:hidden;margin-top:25px}
.bar{height:100%;width:0;background:#111}
.keys{margin-top:30px;border-top:1px solid #eee;padding-top:25px}
.keys h2{font-size:17px;margin:0 0 12px}
.keygrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.keybtn{padding:11px 5px;font-size:14px;background:#f0f0f0}
.keybtn.active{background:#111;color:#fff}
.note{font-size:12px;color:#999;margin-top:22px;text-align:center;line-height:1.5}
@media(max-width:600px){.key{font-size:78px}.keygrid{grid-template-columns:repeat(3,1fr)}.app{padding:25px}}
</style>
</head>
<body>
<div class="app">
<h1>MJ Blues 12 Key Practice</h1>
<div class="sub">12 Key Blues · 내장 반주 연습 프로그램</div>

<div class="keyLabel">CURRENT KEY</div>
<div class="key" id="key">C</div>
<div class="status" id="status">준비되었습니다.</div>

<div class="controls">
<button class="secondary" id="random">🎲 랜덤 KEY + 자동 재생</button>
<button class="primary" id="play">▶ 재생</button>
<button class="secondary" id="stop" disabled>■ 정지</button>
</div>

<div class="settings">
<div class="setting">
<label>TEMPO</label>
<input id="tempo" type="range" min="70" max="170" value="120">
<div class="value"><span id="tempoValue">120</span> BPM</div>
</div>
<div class="setting">
<label>반복</label>
<select id="loops">
<option value="1">1회</option>
<option value="2">2회</option>
<option value="4">4회</option>
<option value="8">8회</option>
</select>
</div>
</div>

<div class="progress"><div class="bar" id="bar"></div></div>

<div class="keys">
<h2>직접 KEY 선택</h2>
<div class="keygrid" id="keygrid"></div>
</div>

<div class="note">
12개 KEY의 블루스 반주가 내장되어 있습니다.<br>
음원은 제공받은 6개 원본을 기준으로 나머지 KEY를 트랜스포즈했습니다.
</div>
</div>

<script>
const AUDIO_DATA = {"C":"audio/C.mp3","Db":"audio/Db.mp3","D":"audio/D.mp3","Eb":"audio/Eb.mp3","E":"audio/E.mp3","F":"audio/F.mp3","Gb":"audio/Gb.mp3","G":"audio/G.mp3","Ab":"audio/Ab.mp3","A":"audio/A.mp3","Bb":"audio/Bb.mp3","B":"audio/B.mp3"};
const KEYS = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
let current=0, audio=null, raf=null, count=0;

const keyEl=document.getElementById("key");
const statusEl=document.getElementById("status");
const playBtn=document.getElementById("play");
const stopBtn=document.getElementById("stop");
const randomBtn=document.getElementById("random");
const tempo=document.getElementById("tempo");
const tempoValue=document.getElementById("tempoValue");
const loops=document.getElementById("loops");
const bar=document.getElementById("bar");
const keygrid=document.getElementById("keygrid");

KEYS.forEach((k,i)=>{
  const b=document.createElement("button");
  b.className="keybtn";
  b.textContent=k;
  b.onclick=()=>selectKey(i);
  keygrid.appendChild(b);
});

function updateUI(){
  keyEl.textContent=KEYS[current];
  [...keygrid.children].forEach((b,i)=>b.classList.toggle("active",i===current));
}
function selectKey(i){
  stopAudio();
  current=i;
  updateUI();
  statusEl.textContent=KEYS[current]+" Key · 재생 준비 완료";
}
function randomKey(){
  stopAudio();
  let n=Math.floor(Math.random()*KEYS.length);
  if(n===current)n=(n+1)%KEYS.length;
  current=n;
  updateUI();
  playAudio();
}
tempo.oninput=()=>{
  tempoValue.textContent=tempo.value;
  if(audio) audio.playbackRate=Number(tempo.value)/120;
};

function stopAudio(){
  if(audio){audio.pause();audio.currentTime=0;audio=null}
  if(raf)cancelAnimationFrame(raf);
  bar.style.width="0%";
  playBtn.disabled=false;stopBtn.disabled=true;randomBtn.disabled=false;
}

function playAudio(){
  stopAudio();
  const data=AUDIO_DATA[KEYS[current]];
  audio=new Audio(data);
  audio.preload="auto";
  audio.preservesPitch=true;
  audio.mozPreservesPitch=true;
  audio.webkitPreservesPitch=true;
  audio.playbackRate=Number(tempo.value)/120;
  count=0;

  audio.onloadedmetadata=()=>{
    statusEl.textContent=`${KEYS[current]} Key · ${tempo.value} BPM · 재생 중`;
    playBtn.disabled=true;stopBtn.disabled=false;randomBtn.disabled=true;
    audio.play();
    updateProgress();
  };
  audio.onended=()=>{
    count++;
    if(count<Number(loops.value)){
      audio.currentTime=0;
      audio.play();
    }else{
      stopAudio();
      statusEl.textContent=`${KEYS[current]} Key · 재생 완료`;
    }
  };
  audio.onerror=()=>{
    stopAudio();
    statusEl.textContent="음원을 재생할 수 없습니다.";
  };
}
function updateProgress(){
  if(!audio || audio.paused)return;
  const p=audio.duration ? audio.currentTime/audio.duration : 0;
  bar.style.width=(p*100)+"%";
  raf=requestAnimationFrame(updateProgress);
}
playBtn.onclick=playAudio;
stopBtn.onclick=()=>{
  stopAudio();
  statusEl.textContent=KEYS[current]+" Key · 정지";
};
randomBtn.onclick=randomKey;
updateUI();
</script>
</body>
</html>
